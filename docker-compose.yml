services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menina_app
    # Nombre que devuelve gethostname(): la página /balanceo lo usa para mostrar qué PHP atendió
    hostname: nodo-a
    restart: unless-stopped
    volumes:
      - ./src:/var/www
      # vendor en un volumen Linux: leerlo desde la carpeta de Windows hacía cada petición 1-7 s más lenta
      - vendor:/var/www/vendor
    working_dir: /var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - menina_net

  # Nodo A: nginx + app. Sin puerto publicado: todo el tráfico entra por HAProxy (8000)
  nginx:
    image: nginx:alpine
    container_name: menina_nginx
    restart: unless-stopped
    expose:
      - "80"
    environment:
      PHP_FPM_HOST: app
    volumes:
      - ./src:/var/www
      # Se monta como plantilla: nginx reemplaza ${PHP_FPM_HOST} al arrancar
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app
    networks:
      - menina_net

  # Nodo B: misma app con su propio PHP-FPM, para que HAProxy reparta la carga de PHP entre los dos.
  # Sesiones y caché están en PostgreSQL, así que da igual qué nodo atienda cada petición
  app_b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menina_app_b
    hostname: nodo-b
    restart: unless-stopped
    volumes:
      - ./src:/var/www
      - vendor:/var/www/vendor
    working_dir: /var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - menina_net

  nginx_b:
    image: nginx:alpine
    container_name: menina_nginx_b
    restart: unless-stopped
    expose:
      - "80"
    environment:
      PHP_FPM_HOST: app_b
    volumes:
      - ./src:/var/www
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app_b
    networks:
      - menina_net

  db:
    image: postgres:18
    container_name: menina_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: menina_coiffure
      POSTGRES_USER: menina
      POSTGRES_PASSWORD: menina123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menina -d menina_coiffure"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - menina_net

  # Proveedor de identidad (login, registro y recuperación de contraseña). Usa su propio volumen
  # y no toca la base del salón. El realm se importa desde keycloak/realm-menina.json al arrancar
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: menina_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # El navegador y Laravel ven a Keycloak con URLs distintas; los tokens siempre llevan la pública
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-menina.json:/opt/keycloak/data/import/realm-menina.json:ro
      # Tema propio del login (misma estética que /login); start-dev no cachea los temas
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      - menina_net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: menina_portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "9001:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - menina_net

  # Balanceador frontal: reparte entre el nodo A (nginx) y el nodo B (nginx_b). Panel en :8404/stats
  haproxy:
    image: haproxy:3.0-alpine
    container_name: menina_haproxy
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8404:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - nginx
      - nginx_b
    networks:
      - menina_net

networks:
  menina_net:
    driver: bridge

volumes:
  db_data:
  portainer_data:
  keycloak_data:
  vendor: