server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    index index.php index.html;

    # Ocultar versión de Nginx por seguridad
    server_tokens off;

    # Subida de archivos (imágenes/comprobantes)
    client_max_body_size 20M;

    # Configuración para IP real desde HAProxy
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Cada nodo Nginx tiene su propio PHP-FPM (PHP_FPM_HOST en docker-compose.yml)
        fastcgi_pass ${PHP_FPM_HOST}:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}