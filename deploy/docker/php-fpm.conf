; Pool de PHP-FPM para el VPS (4 vCPU, 8 GB) con dos nodos: hasta 12 procesos por nodo.
; HAProxy usa maxconn 12 por nodo, así que lo que no entra espera en su cola (visible en el panel)
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Recicla cada proceso tras 500 peticiones: si alguna librería pierde memoria, no crece sin límite
pm.max_requests = 500

; nginx ya registra cada petición: el log de accesos de PHP-FPM sería repetido
access.log = /dev/null
