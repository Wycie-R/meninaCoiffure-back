; Ajustes de producción sobre php.ini-production

; No anunciar la versión de PHP en las cabeceras de respuesta
expose_php = Off

; OPcache: el código no cambia dentro de la imagen, así que no hace falta revisar si cambió
; cada archivo en cada petición (validate_timestamps = 0). Un despliegue nuevo crea contenedores nuevos
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; No hay subida de archivos: alcanza con poco
upload_max_filesize = 5M
post_max_size = 6M
