# HAProxy de producción: misma lógica que el haproxy.cfg de desarrollo (leastconn, health check a /up,
# failover entre A y B), pero solo se llega a él desde Caddy y el panel queda en 127.0.0.1 con contraseña

global
    log stdout format raw local0
    maxconn 2000

# DNS interno de Docker: HAProxy arranca aunque un nodo esté caído y vuelve a encontrarlo
# cuando el contenedor se recrea con otra IP (pasa en cada despliegue)
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    # Si la conexión a un nodo falla, se reintenta y se manda al otro nodo
    retries 2
    option redispatch
    # En desarrollo era 1 s para que la demo de failover fuera rápida; en producción hay más margen
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout http-request    10s
    timeout http-keep-alive 10s
    timeout queue           30s
    timeout check           3s

frontend http_front
    # Solo Caddy llega acá (el puerto no se publica): Caddy ya terminó el HTTPS
    bind *:80
    default_backend nodos_web

backend nodos_web
    # leastconn: las peticiones de PHP duran distinto (reportes vs. páginas simples); va al nodo menos ocupado
    balance leastconn

    # /up es la ruta de salud de Laravel: no abre sesión, así el chequeo no llena la tabla sessions
    option httpchk
    http-check send meth GET uri /up ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    # Qué nodo respondió: solo con APP_DEMO=true, porque la página /balanceo la necesita
    http-response set-header X-Servido-Por %s if { env(APP_DEMO) -m str true }

    # Chequeo cada 2 s; ante un fallo se confirma cada 1 s (2 fallos = caído, ~3 s) y con el nodo caído
    # se prueba cada 5 s. maxconn = procesos de PHP-FPM por nodo: el exceso espera en la cola de HAProxy
    default-server check inter 2s fastinter 1s downinter 5s fall 2 rise 2 maxconn 12 resolvers docker init-addr libc,none
    server nodo_a nginx:80
    server nodo_b nginx_b:80

frontend stats_front
    # Publicado solo en 127.0.0.1:8404 del servidor: se entra por túnel SSH (ver deploy/README.md)
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats hide-version
    # La contraseña llega por variable de entorno desde deploy/.env.production
    stats auth "admin:${HAPROXY_STATS_PASSWORD}"
    # Permite poner un nodo en mantenimiento desde el panel (solo con la contraseña)
    stats admin if TRUE
