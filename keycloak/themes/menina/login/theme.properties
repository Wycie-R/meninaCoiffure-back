# Tema de login de Menina Coiffure: replica la pantalla /login del sistema (Login.vue).
# Hereda de "base" (HTML sin estilos) y reemplaza el layout (template.ftl) y el CSS.
# Las clases kc* son las que usan los templates de Keycloak: acá se apuntan a nuestro CSS,
# así recuperar contraseña, actualizar contraseña, info o error heredan el estilo solos.
parent=base
locales=es

styles=css/menina.css
meta=viewport==width=device-width,initial-scale=1

# Página pública del salón (enlace "Volver al salón"). Cambiarla si el sistema se publica en otro dominio
urlSalon=http://localhost:8000/salon

kcHtmlClass=mc-html
kcBodyClass=mc-cuerpo

## Alertas (mensajes de Keycloak: credenciales incorrectas, correo enviado, etc.)
kcAlertClass=mc-alerta
kcAlertTitleClass=mc-alerta-texto
kcFeedbackErrorIcon=mc-icono mc-icono-alerta
kcFeedbackWarningIcon=mc-icono mc-icono-alerta
kcFeedbackSuccessIcon=mc-icono mc-icono-completada
kcFeedbackInfoIcon=mc-icono mc-icono-info

## Formularios
kcFormClass=mc-formulario
kcFormGroupClass=mc-campo
kcFormGroupErrorClass=mc-campo-con-error
kcLabelWrapperClass=mc-etiqueta-contenedor
kcLabelClass=mc-etiqueta
kcInputWrapperClass=mc-entrada-contenedor
kcInputClass=mc-entrada
kcInputGroup=mc-entrada-grupo
kcInputErrorMessageClass=mc-error-campo
kcInputHelperTextBeforeClass=mc-ayuda
kcInputHelperTextAfterClass=mc-ayuda
kcInputClassCheckbox=mc-casilla
kcInputClassCheckboxInput=mc-casilla-entrada
kcInputClassCheckboxLabel=mc-casilla-texto
kcInputClassRadio=mc-casilla
kcInputClassRadioInput=mc-casilla-entrada
kcInputClassRadioLabel=mc-casilla-texto
kcFormSettingClass=mc-opciones
kcFormOptionsClass=mc-opciones-contenedor
kcFormOptionsWrapperClass=mc-opciones-enlaces
kcFormButtonsClass=mc-botones
kcSignUpClass=mc-alta
kcInfoAreaWrapperClass=mc-alta-contenido

## Botones
kcButtonClass=mc-boton
kcButtonPrimaryClass=mc-boton-primario
kcButtonDefaultClass=mc-boton-secundario
kcButtonBlockClass=mc-boton-ancho
kcButtonLargeClass=

## Mostrar / ocultar contraseña: íconos SVG de línea dibujados por CSS (mc-icono-ojo)
kcFormPasswordVisibilityButtonClass=mc-ver-clave
kcFormPasswordVisibilityIconShow=mc-icono mc-icono-ojo
kcFormPasswordVisibilityIconHide=mc-icono mc-icono-ojo-tachado

## Reiniciar el login (cuando se muestra el correo ya ingresado)
kcResetFlowIcon=mc-icono mc-icono-flecha
