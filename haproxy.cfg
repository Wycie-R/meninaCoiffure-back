global
    log stdout format raw local0
    maxconn 2000

# DNS interno de Docker: HAProxy arranca aunque un nodo esté caído y vuelve a encontrarlo
# cuando el contenedor se recrea con otra IP (necesario para la demo de failover)
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    # Si la conexión a un nodo falla, se reintenta y se manda al otro nodo
    retries 2
    option redispatch
    # Un nodo apagado no rechaza la conexión, solo calla: con 1 s el reintento al otro nodo es rápido
    # (dentro de la red de Docker conectar tarda menos de 1 ms)
    timeout connect         1s
    timeout client          30s
    timeout server          30s
    timeout http-request    10s
    timeout http-keep-alive 10s
    timeout queue           30s
    timeout check           3s

frontend http_front
    bind *:80
    default_backend nodos_web

backend nodos_web
    # leastconn: las peticiones de PHP duran distinto (reportes vs. páginas simples); va al nodo menos ocupado
    balance leastconn

    # /up es la ruta de salud de Laravel: no abre sesión, así el chequeo no llena la tabla sessions
    option httpchk
    http-check send meth GET uri /up ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    # Muestra qué nodo respondió (útil para ver el balanceo y el failover desde el navegador)
    http-response set-header X-Servido-Por %s

    # Chequeo cada 1 s: 2 fallos marcan el nodo caído (~2 s) y 2 aciertos lo devuelven.
    # maxconn por nodo: el exceso espera en la cola de HAProxy en vez de saturar PHP-FPM
    default-server check inter 1s fall 2 rise 2 maxconn 30 resolvers docker init-addr libc,none
    server nodo_a nginx:80
    server nodo_b nginx_b:80

frontend stats_front
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    # Credenciales de desarrollo; "stats admin" permite poner un nodo en mantenimiento desde el panel
    stats auth admin:admin
    stats admin if TRUE
