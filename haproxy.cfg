global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    default_backend nginx_backend

backend nginx_backend
    balance roundrobin
    option httpchk GET /
    server nginx1 nginx:80 check

frontend stats_front
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
