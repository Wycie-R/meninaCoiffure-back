# Producción en el VPS (ver deploy/README.md). Siempre se usa así:
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production <comando>
# El entorno de desarrollo sigue siendo docker-compose.yml.

# Otro nombre de proyecto que el de desarrollo: contenedores, redes y volúmenes no se pisan
# (sin esto, un 'up --remove-orphans' de producción en tu PC borraría los contenedores de desarrollo)
name: menina_prod

# Logs con tope de tamaño en todos los servicios, para no llenar el disco del servidor
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Ningún proceso de los contenedores puede ganar privilegios nuevos (por ejemplo con un binario setuid):
# si alguien llegara a ejecutar algo dentro de uno, se queda con los permisos que tenía
x-seguridad: &seguridad
  - no-new-privileges:true

# Redes separadas: cada contenedor solo ve a los que necesita (en orden de entrada).
#   entrada: Caddy -> HAProxy
#   web:     HAProxy -> nginx de cada nodo
#   php:     nginx -> PHP-FPM (y salida a internet de PHP, para mandar correos)
#   datos:   PHP -> PostgreSQL, sin salida a internet
# Así, por ejemplo, Caddy o HAProxy no pueden hablar con la base aunque alguien los controlara.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      # Superusuario: solo para backups, restauraciones y administración. La app NO lo usa
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Usuario de la app, sin superusuario: lo crea deploy/postgres/ al crear la base
      APP_DB_USER: ${DB_USERNAME}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    # Sin ports: solo los contenedores de la red interna llegan a la base
    volumes:
      - db_data:/var/lib/postgresql
      # Corre una sola vez, cuando el volumen está vacío. El .sql va en otra carpeta porque la
      # imagen ejecutaría solo todo lo que hay en docker-entrypoint-initdb.d, sin las variables
      - ./deploy/postgres/crear-usuario-app.sh:/docker-entrypoint-initdb.d/10-usuario-app.sh:ro
      - ./deploy/postgres/usuario-app.sql:/menina/usuario-app.sql:ro
    healthcheck:
      # $$ para que la variable la lea el contenedor y no Compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    security_opt: *seguridad
    networks:
      - datos
    logging: *logging

  # Nodo A: PHP-FPM con el código, vendor y el build dentro de la imagen
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: app
    image: menina/app:latest
    # gethostname() lo devuelve: /balanceo lo muestra (solo con APP_DEMO=true)
    hostname: nodo-a
    restart: unless-stopped
    env_file: deploy/.env.production
    # env_file trae todo el archivo: se vacían las contraseñas que PHP no usa. Si alguien tomara
    # el control de PHP, no encontraría la del superusuario de la base ni la del panel de HAProxy
    environment: &sin-secretos-ajenos
      POSTGRES_PASSWORD: ""
      HAPROXY_STATS_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
    security_opt: *seguridad
    networks:
      - php
      - datos
    logging: *logging

  # Nodo B: la misma imagen que app, no se vuelve a construir
  app_b:
    image: menina/app:latest
    pull_policy: never
    hostname: nodo-b
    restart: unless-stopped
    env_file: deploy/.env.production
    environment: *sin-secretos-ajenos
    depends_on:
      db:
        condition: service_healthy
    security_opt: *seguridad
    networks:
      - php
      - datos
    logging: *logging

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
    image: menina/web:latest
    restart: unless-stopped
    environment:
      PHP_FPM_HOST: app
    expose:
      - "80"
    depends_on:
      - app
    security_opt: *seguridad
    networks:
      - web
      - php
    logging: *logging

  nginx_b:
    image: menina/web:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      PHP_FPM_HOST: app_b
    expose:
      - "80"
    depends_on:
      - app_b
    security_opt: *seguridad
    networks:
      - web
      - php
    logging: *logging

  # Balanceo entre A y B. No publica el 80: solo Caddy le habla
  haproxy:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    environment:
      HAPROXY_STATS_PASSWORD: ${HAPROXY_STATS_PASSWORD}
      APP_DEMO: ${APP_DEMO:-false}
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Panel de estadísticas solo en el servidor: se entra por túnel SSH
      - "127.0.0.1:8404:8404"
    depends_on:
      - nginx
      - nginx_b
    security_opt: *seguridad
    networks:
      - entrada
      - web
    logging: *logging

  # Única entrada desde internet: HTTPS con Let's Encrypt
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados: si se pierden, Caddy los vuelve a pedir (Let's Encrypt limita cuántos por semana)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - haproxy
    security_opt: *seguridad
    networks:
      - entrada
    logging: *logging

  # Administración de contenedores. Tiene acceso a Docker (equivale a root del servidor), así que:
  # - no arranca con el resto: se levanta solo cuando se usa (ver deploy/README.md, sección Portainer)
  # - va en su propia red: aunque alguien tomara la app, no puede llegar a Portainer
  # - solo escucha en 127.0.0.1: se entra por túnel SSH
  portainer:
    image: portainer/portainer-ce:2.45.1
    profiles: ["admin"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    security_opt: *seguridad
    networks:
      - admin
    logging: *logging

networks:
  entrada:
  web:
  php:
  # internal: la base no tiene salida a internet
  datos:
    internal: true
  admin:

volumes:
  db_data:
  caddy_data:
  caddy_config:
  portainer_data:
